[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-generated boilerplate (env.py) and autogenerated revisions
# (versions/) aren't hand-written and shouldn't be reformatted to satisfy
# the linter - each new migration would otherwise fail CI the moment
# `flask db migrate` generates it.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
