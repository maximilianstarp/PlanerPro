services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - instance-data:/app/instance
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No curl in the python:3.11-slim base image - use the interpreter
      # that's already there instead of adding a package just for this.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      # Next.js inlines NEXT_PUBLIC_* vars at build time, not runtime - the
      # env_file below has no effect on it (that's only visible to the
      # running container, after the JS bundle is already baked). Must be
      # passed as a build arg instead, read from .env like everything else
      # (defaults to the local-dev backend if unset, same as the code's own
      # fallback in src/lib/axios.tsx).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  instance-data:
  db-data:
