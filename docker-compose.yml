services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - instance-data:/app/instance
    env_file:
      - .env
    environment:
      - FLASK_ENV=development

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  instance-data: